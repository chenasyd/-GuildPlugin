id: guild-quest
name: "Guild Quests"
version: 1.0.0
author: GuildPlugin-Team
description: "Guild quest system - accept quests, track progress, claim rewards"
main: com.guild.module.example.quest.GuildQuestModule
api-version: 1.6.6
type: functional
folia-compatible: true
config-prefix: quest

settings:
  max-daily-quests: 3
  max-weekly-quests: 2
  quest-reset-hour: 4
  auto-save-interval-minutes: 10

rewards:
  default-money-reward: 100
  enable-exp-reward: true

# Guild Tree (shared virtual EXP from quests)
tree:
  base-rate: 1.0
  rate-per-level: 0.05
  daily-withdraw-cap-per-level: 1000
  max-single-withdraw-per-level: 500
  upgrade-base-cost: 500
