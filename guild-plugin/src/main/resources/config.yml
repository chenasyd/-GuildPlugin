# GuildPlugin main configuration file

# Guild configuration
guild:
  # Minimum guild name length
  min-name-length: 3
  # Maximum guild name length
  max-name-length: 20
  # Maximum guild tag length
  max-tag-length: 6
  # Maximum guild description length
  max-description-length: 100
  # Maximum members per guild (global cap, actual limit also depends on guild level)
  max-members: 100
  # Cost to create a guild (requires Vault)
  creation-cost: 1000.0
  # Teleport countdown in seconds (0 = instant, no delay)
  home-teleport-delay: 0
  # Lightweight home protection (non-members cannot break/place in radius)
  home-protect:
    enabled: false
    radius: 16
  # No-economy mode: set to true to skip economy checks when no economy plugin (e.g. Vault) is installed
  no-economy-mode: false
  # Guild tag color
  tag-color: "&6"
  # Guild name color
  name-color: "&e"
  # Level system configuration
  # max-level: Maximum level (no further levels beyond this)
  # levels: Funds required to reach the next level (key = current level)
  max-level: 10
  levels:
    1: 5000.0
    2: 10000.0
    3: 20000.0
    4: 35000.0
    5: 50000.0
    6: 75000.0
    7: 100000.0
    8: 150000.0
    9: 200000.0

# Display configuration
display:
  # Role colors (customizable)
  role-colors:
    leader: "&6"    # Leader: gold
    officer: "&b"   # Officer: aqua
    member: "&7"    # Member: gray
  # Role separator configuration
  role-separator:
    enabled: true
    text: " | "
    color-per-role: true      # Whether the separator follows the role color
    default-color: "&7"       # Default color when no role or not in a guild

# Permission configuration
permissions:
  # Default permissions
  default:
    can-create: true         # Allow creating a guild (when not in one)
    can-invite: false        # Non-members cannot invite by default
    can-kick: false          # Non-members cannot kick by default
    can-promote: false       # Non-members cannot promote by default
    can-demote: false        # Non-members cannot demote by default
    can-delete: false        # Non-members cannot delete by default
  
  # Leader permissions (if omitted, all are granted)
  leader:
    can-create: true
    can-invite: true
    can-kick: true
    can-promote: true
    can-demote: true
    can-delete: true
    can-warehouse: true

  # Officer permissions
  officer:
    can-create: true         # Allow deputy operations and creation
    can-invite: true
    can-kick: true
    can-promote: false       # Whether to allow promoting members (usually leader only)
    can-demote: false        # Whether to allow demoting members (usually leader only)
    can-delete: false        # Whether to allow deleting the guild (usually leader only)
    can-warehouse: true
  
  # Member permissions
  member:
    can-create: true         # Allow creating a new guild after leaving
    can-invite: false
    can-kick: false
    can-promote: false
    can-demote: false
    can-delete: false
    can-warehouse: false

# Database backup (plugins/GuildPlugin/backup/)
backup:
  enabled: true
  directory: backup
  max-backups: 50
  # Auto backup on startup if none succeeded today (local date)
  on-startup-daily: true
  # Auto backup when plugin version differs from last successful backup
  on-version-change: true
  mysql:
    # jdbc = portable logical dump (.sql.gz); mysqldump = system CLI if installed
    method: jdbc
    mysqldump-path: mysqldump

# Guild warehouse (requires NBTAPI softdepend; capacity uses historical peak level)
guild-warehouse:
  enabled: true
  # peak_level -> slot count (must be multiples of 9).
  # Each page holds up to 54 slots; e.g. 63 = page1(54) + page2(9). Open with /guild warehouse <page>
  slots-by-level:
    1: 9
    2: 18
    3: 27
    4: 36
    5: 45
    6: 54
    7: 63
    8: 72
    9: 81
    10: 90

# Language configuration
language:
  # Default language (must match the language code in messages_xx.yml)
  # Built-in languages: en (English), zh (Chinese), pl (Polish), br (Brazilian Portuguese)
  # You can add any language by placing the corresponding messages_xx.yml file in the plugin directory
  # Example: to add French, create messages_fr.yml and set default to "fr"
  default: "en"
  # Whether players can switch languages
  allow-player-switch: true
  # Additional language list (for loading languages by code from the plugin data folder or bundled resources)
  # The plugin automatically scans the data directory for language files under lang/core/, lang/gui/, and lang/modules/
  # This list is used to attempt loading these languages at startup.
  # Example: ["de", "fr", "es", "ja"]
  additional-languages: []

# Message configuration
messages:
  # Whether messages are enabled
  enabled: true
  # Message prefix
  prefix: "&6[Guild] &r"
  # Message colors
  colors:
    success: "&a"
    error: "&c"
    info: "&e"
    warning: "&6"

# GUI configuration
gui:
  # Whether GUI is enabled
  enabled: true
  # GUI title
  title: "&6Guild System"
  # GUI size (must be a multiple of 9)
  size: 54
  # Whether to show the guild tag
  show-tag: true
  # Whether to show the guild description
  show-description: true

# Guild chat configuration
guild-chat:
  enabled: true
  format: "&7[&bGuild&7]&r {role} {player}&f: {message}"
  role-leader: "&c&lLeader"
  role-officer: "&6Officer"
  role-member: "&aMember"
  offline-cache-size: 20
  allow-color-codes: true

# Placeholder configuration
placeholders:
  # Whether placeholders are enabled
  enabled: true
  # Placeholder prefix
  prefix: "guild_"
  # Whether to cache placeholders
  cache-enabled: true
  # Cache time (seconds)
  cache-time: 30

# Logging configuration
logging:
  # Whether logging is enabled
  enabled: true
  # Log level: DEBUG, INFO, WARN, ERROR
  level: INFO
  # Whether to log to file
  file-logging: true
  # Log file path
  log-file: "logs/guild.log"
  # Maximum log file size (MB)
  max-file-size: 10
  # Number of log files to retain
  max-files: 5

# Console verbose diagnostics (also toggled in SystemSettingsGUI → 详细后台信息显示)
# When false: hides PlayerConnection detection steps, quiet world-recovery summaries, etc.
debug:
  enabled: false

# Developer mode
developer-mode:
  # Enable developer mode (required to use custom module repositories)
  enabled: false
  # External module repositories (only used when developer mode is enabled)
  # Each repository needs a unique name (alias) and an API URL
  # The built-in official repository is always available and cannot be modified
  # Example:
  # repositories:
  #   - name: "My Repository"
  #     api: "https://api.github.com/repos/your-username/your-repo/releases"
  #   - name: "Community Repo"
  #     api: "https://api.github.com/repos/community/repo/releases"
  repositories: []

# World management configuration (void worlds + crash recovery)
world:
  # Prefix automatically added to managed world names (e.g. input "arena1" -> "gw_arena1")
  name-prefix: "gw_"
  safety:
    # Fallback world for players when a managed world is unloaded/deleted
    fallback-world: "world"
  recovery:
    # Run startup recovery check (detect worlds left over from a crash/abnormal shutdown)
    check-on-startup: true
    # Automatically reload stale worlds found by the recovery check (EDIT worlds are never auto-loaded)
    auto-load-stale: false
    # Remove registry records whose world folder no longer exists
    auto-clean-orphans: true
  edit:
    # Wand material for pos1 (left-click) / pos2 (right-click)
    wand-material: WOODEN_AXE
  schematic:
    # Max selection volume (blocks)
    max-volume: 2000000
    # Skip air blocks when pasting
    ignore-air: true
    # Include tile entities (chests/signs/spawners); falls back to blocks-only on failure
    include-block-entities: true
  arena:
    # Post-match policy for guild-war: destroy | reset (reset currently = destroy + recreate next match)
    post-match: destroy

# Fixed-map guild war (team PVP)
guild-war:
  enabled: true
  # Default schematic preset name (override with /guildwar challenge --preset)
  default-preset: ""
  max-per-team: 5
  signup-seconds: 60
  countdown-seconds: 10
  challenge-timeout-seconds: 120
  # first | timed | survive
  default-mode: first
  score-to-win: 20
  timed-duration-seconds: 600
  survive-duration-seconds: 600
  friendly-fire: false
  keep-inventory: true
  max-concurrent: 3
  # On last-standing elimination: spectator in arena (true) or kick to fallback (false)
  eliminate-to-spectator: true
  # Cancel break/place/bucket in arena during PREPARING/COUNTDOWN/ACTIVE
  arena-protect: true
  # Broadcast a short scoreboard report when a match ends
  broadcast-report: true
  season:
    id: "default"
  rewards:
    # Builtin rewards (also fire WarMatchEndEvent for external plugins)
    enabled: false
    winner-vault: 0
    loser-vault: 0
    winner-guild-bank: 0
    contribution-win: 10
    contribution-per-kill: 1

# Builtin guild activity / hybrid contribution (not A/B coin demos)
guild-activity:
  enabled: true
  # Inject button into GuildInfoGUI module slots
  register-info-button: true
  # totalScore = economyPts + activityPts * weight
  score-weight-activity: 2.0
  # Online minute sampling interval (seconds)
  tick-interval-seconds: 60
  # Minutes online in a day to count as one active day this week
  daily-active-minutes: 5
