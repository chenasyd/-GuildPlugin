# ============================================================
# Module Language Global Configuration
# ============================================================
# Controls the default language for all guild modules (announcement / member-rank / quest / stats, etc.).
# Module message files are located at lang/modules/{module-directory}/{language}.yml
#
# This configuration is completely independent from the plugin core (language.default in config.yml).
# The plugin core language is used for core/gui messages; the module language is only used for module messages.
# Both are loaded independently at startup and reload, without affecting each other.
#
# Built-in languages: en (English), zh (Chinese), pl (Polski), br (Português-BR)
# ============================================================

language:
  # Default module language
  # Falls back to "en" if not set or the corresponding language file does not exist
  default: "en"
