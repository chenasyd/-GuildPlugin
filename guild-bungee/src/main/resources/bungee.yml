name: GuildBungee
main: com.guild.bungee.GuildBungeePlugin
version: 1.6.6
author: GuildPlugin Team
description: Cross-server guild data synchronization bridge for BungeeCord networks

# Geyser's plugin name on BungeeCord is "Geyser-BungeeCord" (not "Geyser")
# BungeeCord performs exact matching on softDepends; an incorrect name will cause uncontrolled load order
softDepends: [Geyser-BungeeCord]
