name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Verify (tests + enforcer + package)
      run: mvn -B verify -pl guild-sdk,guild-comm,guild-plugin,guild-bungee -am

    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report-${{ github.sha }}
        path: guild-plugin/target/site/jacoco/
        retention-days: 14

    - name: Build Announcement Module
      run: mvn -B package -DskipTests -Pbuild-announcement-module

    - name: Build Quest Module
      run: mvn -B package -DskipTests -Pbuild-quest-module

    - name: Build Member Rank Module
      run: mvn -B package -DskipTests -Pbuild-member-rank-module

    - name: Build API Test Module
      run: mvn -B package -DskipTests -Pbuild-api-test-module

    - name: Build Territory Module
      run: mvn -B package -DskipTests -Pbuild-territory-module

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GuildPlugin-${{ github.sha }}
        path: |
          guild-plugin/target/*.jar
          guild-plugin/target/modules/*.jar
          guild-sdk/target/*.jar
          guild-comm/target/*.jar
          guild-bungee/target/*.jar
        retention-days: 30

    - name: Upload to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: |
          guild-plugin/target/*.jar
          guild-plugin/target/modules/*.jar
          guild-sdk/target/*.jar
          guild-comm/target/*.jar
          guild-bungee/target/*.jar
